apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: claimiq-ingress
  namespace: claimiq
spec:
 ingressClassName: traefik
 rules:
  - http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: claimiq-frontend
              port:
                number: 80
        - path: /health
          pathType: Prefix
          backend:
            service:
              name: claimiq-backend
              port:
                number: 5000


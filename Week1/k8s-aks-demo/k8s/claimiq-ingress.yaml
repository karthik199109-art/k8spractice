apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: claimiq-ingress
  namespace: claimiq
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - demoproject.in
        - www.demoproject.in
      secretName: claimiq-tls-secret
  rules:
    - host: demoproject.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: claimiq-frontend
                port:
                  number: 80
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: claimiq-backend
                port:
                  number: 5000
    - host: www.demoproject.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: claimiq-frontend
                port:
                  number: 80
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: claimiq-backend
                port:
                  number: 5000



services:
  frontend:
    build: ./frontend
    image: claimqregistry.azurecr.io/claimiq-frontend:latest
    ports:
      - "8080:80"
    depends_on:
      - backend
  
  backend:
    build: ./backend
    image: claimqregistry.azurecr.io/claimiq-backend:latest
    environment:
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
  
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgresuser -d claimiq"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
    
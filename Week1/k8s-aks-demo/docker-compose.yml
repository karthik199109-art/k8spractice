services:
  frontend:
    build: ./frontend
    image: claimiq-frontend:v1
    ports:
      - "8080:80"
    depends_on:
      - backend
  
  backend:
    build: ./backend
    image: claimiq-backend:v1
    environment:
      DB_HOST: postgres
      DB_NAME: claimiq
      DB_USER: postgresuser
      DB_PASSWORD: Thelastofus09@
      DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
  
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: claimiq
      POSTGRES_USER: postgresuser
      POSTGRES_PASSWORD: Thelastofus09@
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgresuser -d claimiq"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
    
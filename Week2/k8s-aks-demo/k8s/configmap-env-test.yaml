apiVersion: v1
kind: Pod
metadata:
  name: configmap-test-pod
  namespace: claimiq
spec:
  containers:
    - name: test-containers
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: MY_APP_ENV
          valueFrom:
            configMapKeyRef:
              name: claimiq-config
              key: APP_ENV

apiVersion: v1
kind: Pod
metadata:
  name: configmap-volume-pod
  namespace: claimiq
spec:
  containers:
    - name: test-container
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: config-volume
          mountPath: /config
          readOnly: true
  volumes:
    - name: config-volume
      configMap:
       name: claimiq-config
    
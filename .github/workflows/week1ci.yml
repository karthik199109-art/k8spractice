name: week1project
on: [workflow_dispatch]
permissions:
  id-token: write
  contents: read
  security-events: write
  actions: read
jobs:
  build:
    name: build docker images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Azure Login
        uses: azure/login@v3
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
      - name: Verify Azure Login
        run: |
          az account show
          az group list --output table
      - name: Display folder structure
        run: |
          sudo apt-get update
          sudo apt-get install -y tree
          tree -a -L 3
      - name: Build Docker Image
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER}}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        run: |
          cd Week1/k8s-aks-demo/
          docker compose build
      - name: Scan Frontend Docker Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'claimqregistry.azurecr.io/claimiq-frontend:latest'
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
      - name: Scan Backend Docker Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'claimqregistry.azurecr.io/claimiq-backend:latest'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
      - name: Upload Frontend Scan Results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-frontend-results.sarif'
          category: 'frontend-scan'
      - name: Upload Backend Scan Results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-backend-results.sarif'
          category: 'backend-scan'
      - name: ACR Login
        run: |
          az acr login --name claimqregistry
      - name: Push the Image to ACR
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER}}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        run: |
          cd Week1/k8s-aks-demo/
          docker compose push
  deploy:
    name: Deploy K8s Images
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Azure Login
        uses: azure/login@v3
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
      # - name: Install Cert manager and Ingress Controller
      #   run: |
      #     # Install Ingress Controller
      #     helm install traefik traefik/traefik --version 42.1.3 --namespace traefik --create-namespace
      #     # Install Cert Manager
      #     helm install cert-manager jetstack/cert-manager --namespace cert-manager --create-namespace --set crds.enabled=true
      - name: Connect to AKS
        uses: azure/aks-set-context@v5
        with:
          resource-group: rg-claimiq-aks-dev
          cluster-name: claimiq-aks-dev
      - name: Create Namespace
        run: |
          cd Week1/k8s-aks-demo/
          kubectl apply -f k8s/namespace.yaml
      - name: Create PostgreSQL Secret
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        run: |
          kubectl create secret generic postgres-secret \
            --namespace claimiq \
            --from-literal=POSTGRES_DB="$POSTGRES_DB" \
            --from-literal=POSTGRES_USER="$POSTGRES_USER" \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Deploy PostgresSQL Resources
        run: |
          cd Week1/k8s-aks-demo/
          kubectl apply -f k8s/database/pvc.yml
          kubectl apply -f k8s/database/deployment.yml
          kubectl apply -f k8s/database/service.yml
      - name: Wait for PostgreSQL
        run: |
          kubectl rollout status deployment/postgres \
            -n claimiq \
            --timeout=180s
      - name: Create PostgreSQL init ConfigMap
        run: |
          kubectl create configmap postgres-init-sql \
            --namespace claimiq \
            --from-file=init.sql=Week1/k8s-aks-demo/database/init.sql \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Run PostgreSQL initialization Job
        run: |
          kubectl delete job postgres-init \
            --namespace claimiq \
            --ignore-not-found=true
          kubectl apply -f Week1/k8s-aks-demo/k8s/database/init-job.yml
          kubectl wait --for=condition=complete job/postgres-init \
            --namespace claimiq \
            --timeout=180s
      
      - name: Deploy Backend
        run: |
          cd Week1/k8s-aks-demo/
          kubectl apply -f k8s/backend/deployment.yml
          kubectl apply -f k8s/backend/service.yml
          kubectl apply -f k8s/backend/nodeportservice.yml
      - name: Wait for backend
        run: |
          kubectl rollout status deployment/claimiq-backend \
            -n claimiq \
            --timeout=180s

      - name: Deploy Frontend
        run: |
          cd Week1/k8s-aks-demo/
          kubectl apply -f k8s/frontend/deployment.yml
          kubectl apply -f k8s/frontend/service.yml
      - name: Wait for frontend
        run: |
          kubectl rollout status deployment/claimiq-frontend \
            -n claimiq \
            --timeout=180s
      - name: Create Ingress Resource, Certificate
        run: |
          cd Week1/k8s-aks-demo/
          kubectl apply -f k8s/letsencrypt-staging.yaml
          kubectl apply -f k8s/claimiq-ingress.yaml
          kubectl apply -f k8s/claimiq-certificate.yaml
      - name: Verify deployment
        if: always()
        run: |
          kubectl get pods -n claimiq
          kubectl get services -n claimiq
          kubectl get pvc -n claimiq
          kubectl get events -n claimiq --sort-by=.lastTimestamp
  
        

name: week1project
on: [workflow_dispatch]
permissions:
  id-token: write
  contents: read
jobs:
  build:
    name: build docker images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Azure Login
        uses: azure/login@v3
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
      - name: Verify Azure Login
        run: |
          az account show
          az group list --output table
      - name: Display folder structure
        run: |
          sudo apt-get update
          sudo apt-get install -y tree
          tree -a -L 3
      - name: Build Docker Image
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER}}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        run: |
          cd Week1/k8s-aks-demo/
          docker compose build
      - name: ACR Login
        run: |
          az acr login --name claimqregistry
      - name: Push the Image to ACR
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER}}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        run: |
          cd Week1/k8s-aks-demo/
          docker compose push
  deploy:
    name: Deploy K8s Images
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Azure Login
        uses: azure/login@v3
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
      - name: Connect to AKS
        uses: azure/aks-set-context@v5
        with:
          resource-group: rg-claimiq-aks-dev
          cluster-name: claimiq-aks-dev
      - name: Create Namespace
        run: |
          cd Week1/k8s-aks-demo/
          kubectl apply -f k8s/namespace.yaml
      - name: Create PostgreSQL Secret
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER}}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        run: |
          kubectl create secret generic postgres-secret \
            --namespace claimiq \
            --from-literal=POSTGRES_DB=claimiq \
            --from-literal=POSTGRES_USER=appuser \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Deploy PostgresSQL Resources
        run: |
          kubectl apply -f k8s/database/pvc.yaml
          kubectl apply -f k8s/database/deployment.yaml
          kubectl apply -f k8s/database/service.yaml
      - name: Wait for PostgreSQL
        run: |
          kubectl rollout status deployment/postgres \
            -n claimiq \
            --timeout=180s

      - name: Verify deployment
        if: always()
        run: |
          kubectl get pods -n claimiq
          kubectl get services -n claimiq
          kubectl get pvc -n claimiq
        


